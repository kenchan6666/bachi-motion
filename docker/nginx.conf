# Unprivileged static server for bachi-motion.
# Listens on 8080 so the master process can run as the nginx user.
# Asset URLs in the app are relative, so this image works at / or behind
# a reverse proxy that strips a prefix such as /taiko/.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 128;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    types {
        text/plain tja;
    }

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        audio/wav;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log /dev/stdout;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location / {
            try_files $uri $uri/ =404;
        }

        location /js/ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        location /assets/ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        location /samples/ {
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }
    }
}

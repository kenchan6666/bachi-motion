name: Windows package

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Packaging checks
        run: |
          node tests/render-accel.test.js
          node tests/offline-assets.test.js
          node tests/desktop-shell.test.js

      - name: Assemble Windows folder
        shell: pwsh
        run: ./packaging/windows/assemble.ps1

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: bachi-motion-windows-x64
          path: dist/bachi-motion-*-windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./packaging/windows/publish-release.ps1

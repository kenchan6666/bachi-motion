<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" href="data:,">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>溯溯的鼓棒</title>
<style>
  :root { --bg:#ecebe6; --ink:#4a3a30; --R:#5FC99A; --L:#F49AC1; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family: "PingFang SC","Hiragino Sans","Noto Sans CJK SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 10px; }
  h1 { font-size: 19px; margin: 4px 0 2px; }
  #song { font-size: 13px; opacity: .7; margin: 0 0 8px; min-height: 1.2em; }
  svg#stage { width:100%; height:auto; display:block; background:var(--bg); border-radius:14px;
              border: 1px solid #ddd9cf; }
  .composer { background:#fff; border:1px solid #ddd9cf; border-radius:14px; padding:10px 12px; margin:0 0 10px; }
  .composer textarea { width:100%; min-height:140px; font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                       border:1px solid #e0dbd2; border-radius:8px; padding:8px; resize:vertical; color:var(--ink);
                       background:#faf9f6; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:8px 0 0; }
  .composer button, .file-btn { font:inherit; border:2px solid #cdbfb2; background:#fff; border-radius:999px;
                                padding:4px 12px; cursor:pointer; color:var(--ink); }
  .composer button.on, .composer button.primary { background:var(--ink); color:#fff; border-color:var(--ink); }
  .file-btn input { display:none; }
  .composer select { font:inherit; border:2px solid #cdbfb2; background:#fff; border-radius:999px;
                     padding:4px 10px; color:var(--ink); }
  .hint { font-size:12px; opacity:.7; }
  #error { margin:8px 0 0; padding:6px 10px; border-radius:8px; background:#fde8e4; color:#8c2f22; font-size:13px; }
  #jsonPanel { margin-top:8px; }
  .controls { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; margin:10px 2px; font-size:14px; }
  .controls button { font:inherit; border:2px solid #cdbfb2; background:#fff; border-radius:999px;
                     padding:4px 12px; cursor:pointer; color:var(--ink); }
  .controls button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .group { display:flex; gap:4px; align-items:center; }
  input[type=range] { accent-color: var(--ink); }
  #scrub { flex:1 1 100%; }
  .status { font-size:12px; opacity:.7; }
  .legend { font-size:12px; opacity:.8; margin: 2px; }
  .legend b.R { color:var(--R); } .legend b.L { color:var(--L); }

  /* Headless export: fill the viewport with just the stage, beige letterbox. */
  body.export { overflow:hidden; }
  body.export .composer,
  body.export .controls,
  body.export .legend,
  body.export h1,
  body.export #song { display:none !important; }
  body.export .wrap {
    max-width:none; padding:0; margin:0;
    width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg);
  }
  body.export svg#stage {
    width:auto; height:100vh; max-width:100vw;
    border:none; border-radius:0;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">溯溯的鼓棒</h1>
  <p id="song"></p>

  <div class="composer">
    <div class="row">
      <span class="hint">模式</span>
      <button type="button" id="modeZhuren" class="on" aria-pressed="true">主人（TJA → 1-1 手顺）</button>
      <button type="button" id="modeSuyue" aria-pressed="false">溯月（手顺 JSON）</button>
    </div>
    <div class="row" style="margin-top:8px">
      <span class="hint">演示谱</span>
      <select id="sampleSelect" aria-label="演示谱">
        <option value="suyue_demo2_8bun16bun">溯溯的练习谱2</option>
        <option value="suyue_demo">溯溯的练习谱</option>
        <option value="suyue_division_test">溯溯的分音测试</option>
        <option value="suyue_roll_demo">溯溯的滚奏示范</option>
      </select>
      <label class="file-btn">打开 TJA<input id="tjaFile" type="file" accept=".tja,text/plain"></label>
      <span class="hint">或直接把谱面贴在下面，再点生成</span>
    </div>
    <textarea id="tjaInput" spellcheck="false" aria-label="TJA 谱面">TITLE:溯溯的练习谱2
SUBTITLE:原创示例 8分散音+16分三连五连
BPM:170
OFFSET:0
COURSE:Oni
LEVEL:6

#START
1020102011202010,
1020121210201020,
2010221020101120,
1021211020102000,
3000400030000000,
#END
</textarea>
    <div id="jsonPanel" hidden>
      <div class="row">
        <label class="file-btn">打开手顺 JSON<input id="jsonFile" type="file" accept=".json,application/json"></label>
        <span class="hint">覆盖自动 1-1，可含滚奏 / 插音 / 金色光圈。格式见 samples/handorder.example.json</span>
      </div>
      <textarea id="jsonInput" spellcheck="false" aria-label="手顺 JSON" placeholder='{ "events": [ { "t": 0, "hand": "R", "face": "don", "grip": "roll" } ] }'></textarea>
    </div>
    <div class="row">
      <button type="button" class="primary" id="btnGenerate">生成 / 播放</button>
      <span class="hint">谱面规则：1 咚　2 咔　3 大咚　4 大咔　0 休止。黄条和气球这版会跳过。</span>
    </div>
    <div id="error" hidden></div>
  </div>

  <svg id="stage" viewBox="0 0 800 860" xmlns="http://www.w3.org/2000/svg" aria-label="鼓棒动画">
    <defs>
      <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="4"/>
      </filter>
      <pattern id="triPat" width="64" height="56" patternUnits="userSpaceOnUse">
        <rect width="64" height="56" fill="#ececee"/>
        <path d="M0,56 L32,0 L64,56 Z" fill="#e1e1e4"/>
      </pattern>
      <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="3.5"/>
      </filter>
      <clipPath id="faceClip"><ellipse cx="400" cy="300" rx="190" ry="118"/></clipPath>
      <clipPath id="laneClip"><rect x="30" y="28" width="745" height="84" rx="42"/></clipPath>
    </defs>
    <g id="static"></g>
    <g id="chart" clip-path="url(#laneClip)"></g>
    <g id="dynamic"></g>
  </svg>

  <div class="controls">
    <button id="btnPlay">⏸ 暂停</button>
    <button id="btnRestart">⏮ 重来</button>
    <button id="btnLoop" class="on">🔁 循环</button>
    <span class="group">慢放
      <button data-rate="0.25">0.25×</button><button data-rate="0.5">0.5×</button>
      <button data-rate="0.75">0.75×</button><button data-rate="1">1×</button>
    </span>
    <span class="group">谱面流速
      <input id="scroll" type="range" min="1" max="4" step="0.5" value="1">
      <b id="scrollVal">1×</b>
    </span>
    <span class="group">内外刷
      <select id="route">
        <option value="data">按数据（默认直上直下）</option>
        <option value="straight">全部直上直下</option>
        <option value="inner">全部内刷（演示）</option>
        <option value="outer">全部外刷（演示）</option>
      </select>
    </span>
    <label class="group"><input id="labels" type="checkbox"> R/L 标签（调试）</label>
    <input id="scrub" type="range" min="0" max="1" step="0.001" value="0">
    <span id="clock" class="status"></span>
    <span id="src" class="status"></span>
  </div>
  <div class="legend">
    <b class="R">● 右手 R（正手）</b>　<b class="L">● 左手 L（逆手）</b>　
    半边鼓面变红 = 咚　鼓边青光 = 咔　拇指食指捏 = 滚奏　整手握 = 单击　金色柔光 = 插音　大音符外圈 = 双手同时打
  </div>
</div>

<script src="js/parser.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
